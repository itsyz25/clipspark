name: ClipSpark
options:
  bundleIdPrefix: com.clipspark
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
targets:
  ClipSpark:
    type: application
    platform: iOS
    sources:
      - ClipSpark
    settings:
      base:
        MARKETING_VERSION: 1.0.1
        CURRENT_PROJECT_VERSION: 2
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: ClipSpark/Info.plist
      properties:
        CFBundleDisplayName: ClipSpark
        UILaunchScreen: {}
        NSPhotoLibraryUsageDescription: "ClipSpark needs access to your photo library so you can import videos to edit."

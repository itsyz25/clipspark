name: Build ClipSpark IPA

on:
  push:
    branches: [main]
    paths:
      - 'ClipSpark/**'
      - 'project.yml'
      - 'brand/**'
      - 'scripts/**'
      - '.github/workflows/build-ipa.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Render app icon (1024 px, from brand SVG)
        run: swift scripts/render_icon.swift

      - name: Build (unsigned, simulator-free)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project ClipSpark.xcodeproj \
            -scheme ClipSpark \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ClipSpark.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" 2>&1 | tee build.log

      - name: Surface compile errors
        if: failure()
        run: |
          grep -nE "error:|warning: .*(deprecated in iOS|unavailable)" build.log | grep -v "generated" | head -40 > errs.txt || true
          while IFS= read -r line; do echo "::error::$line"; done < errs.txt
          echo "---- last 60 log lines ----" >> errs.txt
          tail -60 build.log >> errs.txt
          if [ ! -s errs.txt ]; then tail -80 build.log | while IFS= read -r line; do echo "::error::$line"; done; fi

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R build/ClipSpark.xcarchive/Products/Applications/ClipSpark.app build/Payload/
          cd build && zip -r ClipSpark-unsigned.ipa Payload
          cd ..

      - uses: actions/upload-artifact@v4
        with:
          name: ClipSpark-unsigned-ipa
          path: build/ClipSpark-unsigned.ipa

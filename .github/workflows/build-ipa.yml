name: Build ClipSpark IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned, simulator-free)
        run: |
          xcodebuild archive \
            -project ClipSpark.xcodeproj \
            -scheme ClipSpark \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ClipSpark.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R build/ClipSpark.xcarchive/Products/Applications/ClipSpark.app build/Payload/
          cd build && zip -r ClipSpark-unsigned.ipa Payload
          cd ..

      - uses: actions/upload-artifact@v4
        with:
          name: ClipSpark-unsigned-ipa
          path: build/ClipSpark-unsigned.ipa

name: Build ClipSpark APK

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK (installable, offline — no INTERNET permission)
        run: |
          gradle wrapper --gradle-version 8.11.1
          ./gradlew assembleDebug --no-daemon
        working-directory: android

      - name: Surface build errors
        if: failure()
        working-directory: android
        run: |
          gradle assembleDebug --no-daemon 2>&1 | grep -E "error|e: " | head -40 || true

      - uses: actions/upload-artifact@v4
        with:
          name: ClipSpark-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

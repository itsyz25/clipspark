name: Build ClipSpark APK

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK (installable, offline — no INTERNET permission)
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log
        working-directory: android

      - name: Surface build errors
        if: failure()
        working-directory: android
        run: |
          grep -iE "^e: |error|FAILURE|Failed" build.log | head -40 > errs.txt || true
          while IFS= read -r line; do echo "::error::$line"; done < errs.txt
          if [ ! -s errs.txt ]; then
            tail -50 build.log | while IFS= read -r line; do echo "::error::$line"; done
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ClipSpark-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
